name: simpletv
description: "SimpleTV Desktop (Windows & Linux)"
publish_to: 'none'

version: 1.2.0+1200

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  media_kit: ^1.1.11
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  http: ^1.2.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.5
  window_manager: ^0.7.0
  intl: ^0.20.2
  crypto: ^3.0.6
  xml: ^7.1.0
  desktop_drop: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/playlists/
    - assets/catalog/logos.json
