name: Update channel logos

on:
  schedule:
    - cron: '28 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-channel-logos

jobs:
  refresh:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Refresh and commit the shared catalog
        run: |
          python3 tools/update_logo_catalog.py
          git add -- desktop/assets/catalog/logos.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Update fallback channel logos'
          git push
