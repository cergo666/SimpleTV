name: Restore private catalog
description: Restore the encrypted source adapters and playlist snapshots for a trusted build
inputs:
  key:
    description: Base64-encoded AES-256 catalog key
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install catalog encryption dependency
      shell: bash
      run: python -m pip install cryptography==50.0.2
    - name: Restore catalog
      shell: bash
      env:
        SIMPLETV_CATALOG_KEY: ${{ inputs.key }}
      run: python "$GITHUB_WORKSPACE/tools/private_catalog.py" restore
