version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gradle-plugins:
        patterns:
          - "com.android.*"
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.compose*"
  - package-ecosystem: pub
    directory: /desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
